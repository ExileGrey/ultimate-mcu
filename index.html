<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ultimate MCU</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#f2f5fb;background:#0b1020}*{box-sizing:border-box}body{margin:0}header{padding:24px 18px 12px;background:linear-gradient(125deg,#751b31,#10192f)}h1{font-size:27px;margin:4px 0}small,.muted{color:#aab5c9}main{max-width:720px;margin:auto;padding:16px 16px 100px}.card{background:#182238;border:1px solid #2c3954;border-radius:16px;padding:15px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:#111a2e;border-radius:12px;padding:12px}b.big{font-size:25px}button,input,select,textarea{font:inherit;border-radius:10px}button{background:#ad263f;color:white;border:0;padding:11px 14px;cursor:pointer}button.secondary{background:#283650}button.ghost{background:transparent;border:1px solid #46536a}input,select,textarea{width:100%;padding:11px;background:#0e1729;border:1px solid #3b4963;color:white;margin:6px 0 12px}textarea{min-height:90px}label{font-size:13px;color:#cbd5e1}.tabs{position:fixed;bottom:0;left:0;right:0;background:#121c30;display:flex;justify-content:center;border-top:1px solid #36445f;padding-bottom:env(safe-area-inset-bottom)}.tabs button{flex:1;max-width:150px;background:none;color:#aebbd0;padding:13px 3px;font-size:12px}.tabs button.active{color:white;background:#283650}h2{font-size:20px}h3{font-size:16px;margin:4px 0 8px}.line{display:flex;justify-content:space-between;gap:8px;align-items:center}.pill{font-size:11px;border-radius:99px;padding:5px 8px;background:#35425d}.item{padding:12px 0;border-bottom:1px solid #33415b}.item:last-child{border:0}.hidden{display:none}.notice{border-left:3px solid #df596b;padding:8px 12px;background:#241e32;font-size:13px}.actions{display:flex;flex-wrap:wrap;gap:8px}.actions button{font-size:13px}.reactions{font-size:13px;line-height:1.55}button:disabled{opacity:.5}</style></head><body><header><small>YOUR UNIVERSE · YOUR DECISIONS</small><h1>ULTIMATE MCU</h1><div id="subtitle" class="muted">Cinematic Universe Simulator</div></header><main id="app"></main><nav class="tabs" id="tabs"></nav><script>
const KEY='ultimate-mcu-v01';const original=[['Spider-Man','2030-02-15','Owen Cooper; Mckenna Grace; Louis Partridge; Steven Yeun (Mr. Negative); Bryan Cranston (J. Jonah Jameson)'],['Wolverine','2030-05-17','Jack O’Connell'],['Iron Man','2030-08-16','Nicholas Alexander Chavez (Tony Stark); Daisy Edgar-Jones (Pepper); John Boyega (Rhodey); Riz Ahmed (Ghost)'],['Thor','2030-11-15','Alexander Ludwig (Thor); Bill Skarsgård (Loki); Jodie Comer (Jane); Mads Mikkelsen (Odin)'],['Hulk','2031-02-21',''],['Captain America','2031-05-16',''],['Ant-Man','2031-08-15',''],['Avengers','2031-11-21','']];
const id=()=>Math.random().toString(36).slice(2,10);const seed=()=>({id:id(),name:'Ultimate MCU · Orijinal Evren',date:'2029-07-01',projects:original.map(([title,date,cast])=>({id:id(),title,date,cast,type:'Film',status:'Duyuruldu',budget:''})),events:[],hype:60,legacy:true});let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch{}if(!db||!Array.isArray(db.saves)||!db.saves.length)db={saves:[seed()],active:null};if(!db.active||!db.saves.some(x=>x.id===db.active))db.active=db.saves[0].id;let tab='home';const current=()=>db.saves.find(x=>x.id===db.active);const save=()=>{localStorage.setItem(KEY,JSON.stringify(db));render()};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=s=>s?new Date(s+'T12:00:00').toLocaleDateString('tr-TR'): 'Tarih belirsiz';const $=id=>document.getElementById(id);
function render(){const s=current();$('subtitle').textContent=s.name+' · '+fmt(s.date);$('tabs').innerHTML=[['home','🏠 Panel'],['projects','🎬 Yapımlar'],['announce','📣 Duyuru'],['archive','🗂️ Kayıtlar']].map(([k,t])=>`<button class="${tab===k?'active':''}" onclick="go('${k}')">${t}</button>`).join('');let html='';if(tab==='home'){html=`<div class="card"><div class="line"><h2>Stüdyo Paneli</h2><span class="pill">${esc(s.name)}</span></div><div class="grid"><div class="stat"><small>Yapımlar</small><br><b class="big">${s.projects.length}</b></div><div class="stat"><small>Hayran ilgisi</small><br><b class="big">${s.hype}/100</b></div><div class="stat"><small>Duyurular</small><br><b class="big">${s.events.length}</b></div><div class="stat"><small>Simülasyon tarihi</small><br><b>${fmt(s.date)}</b></div></div></div><div class="card"><h3>Stüdyo kararları</h3><div class="actions"><button onclick="go('announce')">+ Duyuru yap</button><button class="secondary" onclick="go('projects')">Yapımları yönet</button><button class="secondary" onclick="advance()">+ 1 ay ilerle</button></div></div><div class="card"><h3>Son gelişmeler</h3>${s.events.length?s.events.slice().reverse().slice(0,4).map(eventHtml).join(''):'<p class="muted">Henüz duyuru yapılmadı. İlk kararı sen ver.</p>'}</div>`}if(tab==='projects'){html=`<div class="card"><h2>Yapım oluştur</h2><form onsubmit="addProject(event)"><label>Yapım adı</label><input id="pt" required placeholder="Örn. Fantastic Four"><label>Tür</label><select id="pk"><option>Film</option><option>Dizi</option><option>Özel yapım</option></select><label>Vizyon tarihi</label><input id="pd" type="date"><label>Oyuncu / yönetmen notları</label><textarea id="pc" placeholder="Kesinleşmiş kadro bilgileri"></textarea><button>Arşive ekle</button></form></div><div class="card"><h2>Yapımlar (${s.projects.length})</h2>${s.projects.slice().sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999')).map(p=>`<div class="item"><div class="line"><h3>${esc(p.title)}</h3><span class="pill">${esc(p.type)}</span></div><small>${fmt(p.date)} · ${esc(p.status)}</small>${p.cast?`<p class="muted">${esc(p.cast)}</p>`:''}<div class="actions"><button class="secondary" onclick="editProject('${p.id}')">Düzenle</button><button class="ghost" onclick="removeProject('${p.id}')">Sil</button></div></div>`).join('')}</div>`}if(tab==='announce'){html=`<div class="card"><h2>Yeni duyuru</h2><p class="muted">Kararı sen verirsin; oyun kurgusal tepkileri simüle eder.</p><form onsubmit="announce(event)"><label>Duyuru türü</label><select id="ak"><option>Yeni yapım</option><option>Oyuncu seçimi</option><option>Fragman</option><option>Vizyon değişikliği</option><option>Yönetmen açıklaması</option><option>Diğer</option></select><label>Başlık</label><input id="at" required placeholder="Örn. Spider-Man ilk fragmanı yayımlandı"><label>Açıklama</label><textarea id="ad" placeholder="Duyurunun ayrıntıları"></textarea><button>Duyuruyu yayınla</button></form></div><div class="card"><h3>Basın ve hayran tepkileri</h3>${s.events.length?eventHtml(s.events[s.events.length-1]):'<p class="muted">İlk duyurunu bekliyoruz.</p>'}</div>`}if(tab==='archive'){html=`<div class="card"><h2>Evren kayıtları</h2>${db.saves.map(x=>`<div class="item"><div class="line"><div><b>${esc(x.name)}</b><br><small>${x.projects.length} yapım · ${x.events.length} duyuru</small></div><button class="${x.id===db.active?'ghost':'secondary'}" onclick="switchSave('${x.id}')">${x.id===db.active?'Aktif':'Aç'}</button></div></div>`).join('')}<label>Yeni evren adı</label><input id="newName" placeholder="Örn. Ultimate MCU 2.0"><button onclick="newSave()">+ Yeni evren</button></div><div class="card"><h3>Yedekleme</h3><p class="muted">Tüm evrenleri tek JSON dosyasında sakla. Tarayıcı verilerini silersen yerel kayıtlar kaybolabilir.</p><div class="actions"><button onclick="exportData()">Yedeği indir</button><button class="secondary" onclick="$('importFile').click()">Yedeği içe aktar</button></div><input id="importFile" type="file" accept="application/json" style="display:none" onchange="importData(event)"></div><div class="notice">Orijinal evren, doğrulanabilen başlangıç yapımlarıyla açıldı. Eksik eski duyurular otomatik olarak uydurulmadı. Bu sürümde gerçek AI API bağlantısı yok.</div>`}$('app').innerHTML=html}
function eventHtml(e){return `<div class="item"><small>${fmt(e.date)} · ${esc(e.kind)}</small><h3>${esc(e.title)}</h3>${e.description?`<p>${esc(e.description)}</p>`:''}<div class="reactions">${e.reactions.map(r=>`<p>💬 ${esc(r)}</p>`).join('')}</div></div>`}function go(t){tab=t;render();scrollTo(0,0)}function addProject(e){e.preventDefault();current().projects.push({id:id(),title:$('pt').value.trim(),type:$('pk').value,date:$('pd').value,cast:$('pc').value.trim(),status:'Duyuruldu',budget:''});save()}function editProject(pid){let p=current().projects.find(p=>p.id===pid);let title=prompt('Yapım adı',p.title);if(title===null||!title.trim())return;let date=prompt('Vizyon tarihi (YYYY-AA-GG; boş olabilir)',p.date||'');if(date===null)return;let cast=prompt('Oyuncu / yönetmen notları',p.cast||'');if(cast===null)return;p.title=title.trim();p.date=date;p.cast=cast;save()}function removeProject(pid){if(confirm('Bu yapımı arşivden silmek istiyor musun?')){current().projects=current().projects.filter(p=>p.id!==pid);save()}}function announce(e){e.preventDefault();let s=current(),kind=$('ak').value,title=$('at').value.trim(),description=$('ad').value.trim();let impact={'Yeni yapım':7,'Oyuncu seçimi':4,'Fragman':8,'Vizyon değişikliği':-3,'Yönetmen açıklaması':3,'Diğer':2}[kind];s.hype=Math.max(0,Math.min(100,s.hype+impact));let reactions=impact<0?[`Bazı hayranlar takvimdeki değişiklikten endişeli.`,`Sektör yorumcuları yeni tarihin stratejik etkisini tartışıyor.`,`Diğer izleyiciler açıklamanın ayrıntılarını bekliyor.`]:[`Hayran topluluklarında “${title}” duyurusu konuşuluyor.`,`Bazı izleyiciler heyecanlı; bazıları daha fazla ayrıntı bekliyor.`,`Eğlence basını bu hamlenin evrenin gelecek planlarına etkisini tartışıyor.`];s.events.push({id:id(),date:s.date,kind,title,description,reactions});save()}function advance(){let s=current();let d=new Date(s.date+'T12:00:00');d.setMonth(d.getMonth()+1);s.date=d.toISOString().slice(0,10);save()}function switchSave(pid){db.active=pid;tab='home';save()}function newSave(){let name=$('newName').value.trim();if(!name)return alert('Evren adı gir.');let s={id:id(),name,date:'2029-07-01',projects:[],events:[],hype:50};db.saves.push(s);db.active=s.id;tab='home';save()}function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ultimate-mcu-yedek.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}async function importData(e){let f=e.target.files[0];if(!f)return;try{let v=JSON.parse(await f.text());if(!Array.isArray(v.saves)||!v.saves.length||!v.saves.every(s=>s.id&&s.name&&Array.isArray(s.projects)&&Array.isArray(s.events)))throw Error('Geçersiz kayıt');if(!confirm('Mevcut tüm kayıtlar yedek dosyasındakilerle değiştirilsin mi?'))return;db=v;db.active=v.saves.some(s=>s.id===v.active)?v.active:v.saves[0].id;save()}catch(err){alert('Dosya okunamadı: '+err.message)}}render();
</script></body></html>
